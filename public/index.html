    const attendance = '' +
      '<div class="card tinted" style="--tint:var(--teal)"><div class="card-head"><div class="card-title">Attendance</div>' +
        '<span class="tag num">' + pct(a.percentage) + '</span></div>' +
        '<div class="progress' + (a.percentage >= 90 ? '' : (a.percentage >= 80 ? ' partial' : ' empty')) + '">' +
          '<i style="width:' + clamp(a.percentage, 0, 100) + '%"></i></div>' +
        '<p class="muted mt-16" style="font-size:13.5px;line-height:1.6">' + esc(attCopy) + '</p>' +
        (a.recent && a.recent.length
          ? '<div style="margin-top:16px"><div class="faint" style="font-size:11px;text-transform:uppercase;' +
            'letter-spacing:.07em;font-weight:650;margin-bottom:8px">Last ' + a.recent.length + ' school days</div>' +
            '<div class="attstrip">' + a.recent.slice().reverse().map((r) =>
              '<i class="' + esc(r.status) + '" title="' + esc(r.day) + ' · ' + esc(r.status) + '"></i>').join('') +
            '</div></div>'
          : '') +
      '</div>';

    /* ---- academics ---- */
    const ac = d.academics || {};
    const results = ac.results || [];

    const academics = '<div class="card tinted" style="--tint:var(--cyan);margin-bottom:16px">' +
      '<div class="card-head"><div>' +
        '<div class="card-title">Academics</div>' +
        '<div class="card-sub">' + esc(ac.term || 'Current term') + ' · ' +
          (ac.subjects ? ac.subjects.length : 0) + ' subjects enrolled</div></div>' +
        (ac.average != null ? '<span class="tag num">avg ' + ac.average + '</span>' : '') +
      '</div>' +
      (results.length
        ? '<div class="table-wrap"><table><thead><tr><th>Subject</th><th class="num">Score</th>' +
          '<th class="num">Class avg</th><th>Relative</th><th>Grade</th></tr></thead><tbody>' +
          results.map((r) => {
            const diff = r.classAverage != null ? Number(r.score) - Number(r.classAverage) : null;
            const ratio = r.maxScore ? (r.score / r.maxScore) * 100 : null;
            return '<tr><td><b>' + esc(r.subject) + '</b>' +
              '<div class="faint mono" style="font-size:11px">' + esc(r.subjectCode || '') + '</div></td>' +
              '<td class="num" style="font-weight:600">' + r.score +
                '<div class="faint mono" style="font-size:11px">of ' + r.maxScore + '</div></td>' +
              '<td class="num muted">' + (r.classAverage != null ? r.classAverage : '—') + '</td>' +
              '<td>' + (diff == null ? '<span class="tag p-low">—</span>'
                : '<span class="tag" style="' + (diff >= 0
                    ? 'color:var(--ok);border-color:rgba(52,211,153,.32)'
                    : 'color:var(--warn);border-color:rgba(251,191,36,.32)') + '">' +
                  (diff >= 0 ? '+' : '') + diff.toFixed(1) + '</span>') +
              '</td>' +
              '<td><div style="display:flex;align-items:center;gap:9px">' +
                '<div class="bar" style="flex:1"><i style="width:' + clamp(ratio, 0, 100) +
                  '%;background:' + colorForRate(ratio) + '"></i></div>' +
                '<span class="tag num">' + esc(r.letter || '—') + '</span></div></td></tr>';
          }).join('') +
          '</tbody></table></div>'
        : '<div class="empty">No results published for this term yet</div>') +
      '</div>';

    /* ---- fee detail ---- */
    const invoices = f.invoices || [];
    const payments = f.payments || [];
    const installments = f.installments || [];
    const today = new Date().toISOString().slice(0, 10);

    const invoiceTable = invoices.length
      ? '<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Category</th><th>Issued</th>' +
        '<th class="num">Billed</th><th class="num">Paid</th><th>Status</th></tr></thead><tbody>' +
        invoices.map((i) =>
          '<tr><td class="mono" style="font-size:12px">' + esc(i.invoice_no) + '</td>' +
          '<td class="muted">' + esc(String(i.category || '').replace(/_/g, ' ')) + '</td>' +
          '<td class="mono">' + shortDate(i.issued_at) + '</td>' +
          '<td class="num">' + inr(i.amount_billed) + '</td>' +
          '<td class="num">' + inr(i.amount_paid) + '</td>' +
          '<td><span class="tag sev-' + esc(feeSev(i.status)) + '">' + esc(String(i.status).replace('_', ' ')) + '</span></td></tr>').join('') +
        '</tbody></table></div>'
      : '<div class="empty">No invoices issued</div>';

    const paymentTable = payments.length
      ? '<div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Paid</th><th>Invoice</th>' +
        '<th>Method</th><th class="num">Amount</th></tr></thead><tbody>' +
        payments.map((p) =>
          '<tr><td class="mono" style="font-size:12px">' + esc(p.receipt_no) + '</td>' +
          '<td class="mono">' + shortDate(p.paid_at) + '</td>' +
          '<td class="mono muted" style="font-size:12px">' + esc(p.invoice_no) + '</td>' +
          '<td><span class="tag">' + esc(String(p.method).replace('_', ' ')) + '</span></td>' +
          '<td class="num" style="font-weight:600;color:var(--ok)">' + inr(p.amount) + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '<div class="empty">No payments recorded yet</div>';

    const instalmentList = installments.length
      ? installments.map((i) => {
          const late = i.status === 'overdue' || (i.status === 'pending' && i.due_date < today);
          const color = i.status === 'paid' || i.status === 'waived'
            ? 'var(--ok)' : late ? 'var(--crit)' : 'var(--warn)';
          return '<div class="bd-row"><div class="lbl">' +
            '<span class="swatch" style="background:' + color + '"></span>' +
            esc(String(i.label || 'Instalment').replace(/_/g, ' ')) +
            '<span class="faint mono" style="font-size:11px">due ' + shortDate(i.due_date) + '</span></div>' +
            '<div class="amt">' + inr(i.amount) + ' <span class="tag sev-' + esc(feeSev(i.status)) + '">' +
            esc(late ? 'overdue' : i.status) + '</span></div></div>';
        }).join('')
      : '<div class="empty">No instalment plan on file</div>';

    const feeDetail = '<div class="grid two" style="margin-bottom:16px">' +
      '<div class="card"><div class="card-head"><div class="card-title">Invoices</div>' +
        '<span class="tag num">' + invoices.length + '</span></div>' + invoiceTable + '</div>' +
      '<div class="card"><div class="card-head"><div class="card-title">Payments</div>' +
        '<span class="tag num">' + payments.length + '</span></div>' + paymentTable + '</div>' +
      '</div>' +
      '<div class="card"><div class="card-head"><div class="card-title">Instalment Plan</div>' +
        '<span class="tag num">' + installments.filter((i) => i.status === 'paid').length + '/' + installments.length + ' paid</span></div>' +
        instalmentList + '</div>';

    const tabs = '<div class="toolbar" style="margin-bottom:18px">' +
      '<div class="seg" role="tablist">' +
        ['summary', 'academics', 'fees'].map((t) =>
          '<button type="button" role="tab" data-stab="' + t + '" aria-selected="' + (state.tab === t) + '">' +
          t.charAt(0).toUpperCase() + t.slice(1) + '</button>').join('') +
      '</div></div>';

    if (state.tab === 'academics') return tabs + academics;
    if (state.tab === 'fees') return tabs + feeDetail;
    return tabs + stats + statusBanner + progress + '<div class="grid two" style="margin-bottom:16px">' +
      profile + attendance + '</div>' + academics;
  }

  /* ================= routing ================= */

  async function route() {
    if (!state.role) return;
    setPressed(state.role);
    view.innerHTML = skeletonGrid(4);

    try {
      if (state.role === 'ACCOUNTANT') {
        const bar = '<div class="toolbar" style="margin-bottom:18px">' +
          '<div class="seg" role="tablist">' +
            ['overview', 'ledger', 'alerts'].map((t) =>
              '<button type="button" role="tab" data-tab="' + t + '" aria-selected="' + (state.tab === t) + '">' +
              t.charAt(0).toUpperCase() + t.slice(1) + '</button>').join('') +
          '</div>' +
          '<div class="spacer"></div>' +
          (state.tab === 'ledger' ? '<span class="faint" style="font-size:12px">Receipts, ageing, and CSV export</span>'
            : state.tab === 'alerts' ? '<span class="faint" style="font-size:12px">Derived alerts across your account</span>'
              : '<span class="faint" style="font-size:12px">Collection health and AI risk</span>') +
          '</div>';

        if (state.tab === 'ledger') {
          view.innerHTML = bar + ledgerView(await api('/api/accountant/ledger?' + ledgerQuery()));
          wireTabs();
          wireLedger();
          return;
        }
        if (state.tab === 'alerts') {
          view.innerHTML = bar + alertsView(await api('/api/notifications?limit=50'));
          wireTabs();
          wireAlerts();
          return;
        }
        view.innerHTML = bar + accountantView(await api('/api/accountant/overview'));
        wireTabs();
        return;
      }

      if (state.role === 'TEACHER') {
        const grade = state.grade === '' || state.grade === undefined ? '' : '=' + encodeURIComponent(state.grade);
        const d = await api('/api/teacher/students?grade' + grade);
        const a = state.attendance;
        a.today = a.today || isoDay(new Date());
        if (state.ttab === 'attendance') {
          const sheet = await api('/api/teacher/attendance?grade' + grade + '&day=' + encodeURIComponent(a.day || a.today));
          a.day = sheet.day;
          holdSheet(sheet);
          d.students = sheet.students;
          d.today = sheet.today;
        }

        const tabs = '' +
          '<div class="toolbar"><div class="seg" role="tablist">' +
            [['roster', 'Roster'], ['attendance', 'Register'], ['insights', 'Insights']].map(([k, label]) =>
              '<button type="button" role="tab" data-ttab="' + k + '" aria-selected="' + (state.ttab === k) + '">' +
              label + '</button>').join('') +
          '</div><div class="spacer"></div>' +
          '<span class="faint hide-sm" style="font-size:12.5px">' + ({
            roster: 'Click a student to run AI diagnosis',
            attendance: 'Click a student to mark them — nothing saves until you press Save',
            insights: 'Class diagnosis, subjects, and the attendance split',
          }[state.ttab] || '') + '</span></div>';

        const scope = '<label class="field">Grade' +
          '<select id="gradeSel"><option value="">All grades</option>' +
            d.grades.map((g) => '<option value="' + g + '"' +
              (String(g) === String(state.grade) ? ' selected' : '') + '>Grade ' + g + '</option>').join('') +
          '</select></label>';

        view.innerHTML = tabs + scope + teacherView(d);
        wireTeacher();
        return;
      }

      const d = await api('/api/student/me');
      if (!['summary', 'academics', 'fees'].includes(state.tab)) state.tab = 'summary';
      view.innerHTML = studentView(d);
      $$('#view [data-stab]').forEach((b) => b.addEventListener('click', () => {
        state.tab = b.dataset.stab;
        route();
      }));
    } catch (err) {
      view.innerHTML = emptyState(err.message);
      toast('Request failed', err.message);
    }
  }

  function wireTabs() {
    $$('#view [data-tab]').forEach((b) => b.addEventListener('click', () => {
      if (state.tab === b.dataset.tab) return;
      state.tab = b.dataset.tab;
      state.selectedStudent = null;
      route();
    }));
  }

  function wireTeacher() {
    const sel = $('#gradeSel');
    if (sel) {
      sel.addEventListener('change', () => {
        state.grade = sel.value === '' ? '' : Number(sel.value);
        state.selectedStudent = null;
        resetRegister();
        route();
      });
    }
    $$('#view [data-ttab]').forEach((b) => b.addEventListener('click', () => {
      if (state.ttab === b.dataset.ttab) return;
      if (state.ttab === 'attendance' && unsavedCount()) {
        if (!confirm('Discard unsaved register marks?')) return;
        resetRegister();
      }
      state.ttab = b.dataset.ttab;
      state.selectedStudent = null;
      route();
    }));
    $$('#view tr.clickable').forEach((tr) => {
      tr.addEventListener('click', () => selectStudent(Number(tr.dataset.student)));
    });
    if (state.ttab === 'attendance') wireRollCall();
  }

  /* ---- register state helpers ---- */

  /**
   * How many rows differ from what is on the server. Compared, not counted —
   * a bulk "everyone present" writes a draft key for all fifty students, but
   * only the ones that actually changed should block a tab change.
   */
  function unsavedCount() {
    const a = state.attendance;
    return Object.keys(a.draft)
      .filter((id) => a.draft[id] !== (a.saved[id] || '')).length;
  }

  /** Throw away unflipped marks — used on tab/grade/day change. */
  function resetRegister() {
    state.attendance.draft = {};
    state.attendance.saved = {};
  }

  /** Cache the sheet the register was rendered from, for local repaints. */
  function holdSheet(d) {
    const a = state.attendance;
    const saved = {};
    for (const st of d.students || []) saved[st.id] = st.status || '';
    a.saved = saved;
    a.today = d.today || a.today;
    a.sheet = d;
  }

  function wireRollCall() {
    const a = state.attendance;
    if (!a.sheet) return;

    const goDay = (day) => {
      if (unsavedCount() && !confirm('Discard unsaved register marks?')) return;
      resetRegister();
      a.day = day;
      route();
    };

    const dateInput = $('#rcDay');
    if (dateInput) dateInput.addEventListener('change', () => goDay(dateInput.value));
    const prev = $('#rcPrev');
    if (prev) prev.addEventListener('click', () => goDay(shiftDay(a.sheet.day, -1)));
    const next = $('#rcNext');
    if (next) next.addEventListener('click', () => goDay(shiftDay(a.sheet.day, 1)));

    $$('#view .tally').forEach((t) => t.addEventListener('click', () => {
      const want = t.dataset.bulk || '';
      const sheet = a.sheet;
      if (!sheet) return;
      for (const st of sheet.students) a.draft[st.id] = want;
      refreshRollCall(sheet);
    }));

    $$('#view .rcard').forEach((card) => {
      const id = card.dataset.rc;
      card.addEventListener('click', () => {
        a.draft[id] = nextStatus(a.draft[id] !== undefined ? a.draft[id] : (a.saved[id] || ''));
        refreshRollCall(a.sheet);
        refocusCard(id);
      });
      card.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'arrowright' || k === 'arrowdown') { e.preventDefault(); moveFocus(card, 1); return; }
        if (k === 'arrowleft' || k === 'arrowup') { e.preventDefault(); moveFocus(card, -1); return; }
        if (k === '0' || k === 'backspace' || k === 'delete') {
          e.preventDefault();
          a.draft[id] = '';
          refreshRollCall(a.sheet);
          refocusCard(id);
          return;
        }
        const next = statusForKey(k);
        if (!next) return;
        e.preventDefault();
        a.draft[id] = a.draft[id] === next ? '' : next;
        refreshRollCall(a.sheet);
        refocusCard(id);
      });
    });

    const undo = $('#rcUndo');
    if (undo) undo.addEventListener('click', () => {
      resetRegister();
      refreshRollCall(a.sheet);
    });

    const save = $('#rcSave');
    if (save) save.addEventListener('click', () => saveRegister());
  }

  const refocusCard = (id) => {
    const el = document.querySelector('#view .rcard[data-rc="' + id + '"]');
    if (el) el.focus();
  };

  const moveFocus = (card, delta) => {
    const cards = $$('#view .rcard');
    const i = cards.indexOf(card);
    const next = cards[Math.min(cards.length - 1, Math.max(0, i + delta))];
    if (next) next.focus();
  };

  /** File every changed row in one request, then re-sync from the response. */
  async function saveRegister() {
    const a = state.attendance;
    const btn = $('#rcSave');
    if (!btn || a.busy) return;

    const changed = Object.keys(a.draft)
      .filter((id) => a.draft[id] !== (a.saved[id] || ''))
      .map((id) => ({ studentId: Number(id), status: a.draft[id] || null }));
    if (!changed.length) return;

    a.busy = true;
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const res = await api('/api/teacher/attendance', {
        method: 'POST',
        body: JSON.stringify({
          day: a.sheet.day,
          grade: state.grade === '' ? null : Number(state.grade),
          entries: changed,
        }),
      });
      const sheet = res.sheet || a.sheet;
      holdSheet(sheet);
      resetRegister();
      a.busy = false;
      toast('Register saved', res.marked + ' mark' + (res.marked === 1 ? '' : 's') +
        ' filed for ' + prettyDay(res.day) + '.');
      // The roster's headline percentages moved, so pull fresh numbers in.
      await route();
    } catch (err) {
      a.busy = false;
      toast('Could not save register', err.message);
      const b = $('#rcSave');
      if (b) { b.disabled = false; b.textContent = 'Save register'; }
    }
  }

  async function selectStudent(id) {
    state.selectedStudent = id;
    $$('#view tr.clickable').forEach((tr) => {
      tr.classList.toggle('active', Number(tr.dataset.student) === id);
    });

    let host = $('#planHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'planHost';
      view.appendChild(host);
    }
    host.innerHTML = '<div class="card skeleton" style="height:190px;margin-top:16px"></div>';

    try {
      host.innerHTML = planView(await api('/api/teacher/diagnose?studentId=' + encodeURIComponent(id)));
    } catch (err) {
      host.innerHTML = '<div class="card" style="margin-top:16px">' +
        '<div class="card-title" style="margin-bottom:8px">Diagnosis unavailable</div>' +
        '<p class="muted" style="font-size:13.5px">' + esc(err.message) + '</p></div>';
    }
  }

  /* ================= boot ================= */

  async function boot() {
    try {
      const h = await api('/api/health');
      const live = h.ai.configured;
      const plan = h.ai.plan?.fast || [];
      $('#aiChip').className = 'ai-chip ' + (live ? 'live' : 'offline');
      $('#aiText').textContent = live
        ? h.ai.providers.map((p) => p.toUpperCase()).join(' + ') + ' · '
          + plan.slice(0, 3).map((c) => c.model).join(' → ')
        : 'offline — set an API key';
      $('#aiChip').title = live
        ? 'Providers: ' + h.ai.providers.join(', ') + '\nEndpoint: ' + h.ai.endpoint
          + '\nFast: ' + plan.map((c) => `${c.model} [${c.provider}]`).join(', ')
        : 'No GEMINI_API_KEY or OPENCODE_ZEN_API_KEY found. Serving deterministic local analysis.';
    } catch {
      $('#aiText').textContent = 'server unreachable';
      $('#aiChip').className = 'ai-chip offline';
    }

    // A live cookie session wins; otherwise auto sign-in so the page is never
    // a dead end. Either way the reload keeps you signed in.
    if (await adoptSession()) {
      await route();
      return;
    }
    await login('ACCOUNTANT');
  }

  $$('#switcher button').forEach((btn) => {
    btn.addEventListener('click', () => login(btn.dataset.role));
  });

  $('#bell').addEventListener('click', (e) => {
    e.stopPropagation();
    const panel = $('#bellPanel');
    if (panel.hidden) openBell(); else closeBell();
  });

  $('#bellPanel').addEventListener('click', async (e) => {
    e.stopPropagation();
    const markAll = e.target.closest('#markAll');
    const sweep = e.target.closest('#genAlerts');
    const item = e.target.closest('.nitem');

    if (markAll) {
      markAll.disabled = true;
      try {
        await api('/api/notifications/read-all', { method: 'POST' });
        state.unread = 0;
        renderBadge();
        await openBell();
      } catch (err) {
        toast('Could not clear alerts', err.message);
      }
      return;
    }

    if (sweep) {
      sweep.disabled = true;
      sweep.textContent = 'Sweeping…';
      try {
        const r = await api('/api/notifications/generate', { method: 'POST' });
        toast('Alert sweep', r.created
          ? (r.created + ' new alert' + (r.created === 1 ? '' : 's'))
          : 'Already up to date — nothing new to raise.');
        await openBell();
        pollUnread();
      } catch (err) {
        toast('Sweep failed', err.message);
        sweep.disabled = false;
        sweep.textContent = 'Run alert sweep';
      }
      return;
    }

    if (item) {
      const link = item.dataset.link;
      await markRead(item.dataset.notif);
      if (link === 'ledger') { closeBell(); state.tab = 'ledger'; route(); return; }
      if (link === 'attendance' || link === 'academics') { closeBell(); }
      if (!link) openBell();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#bellHost')) closeBell();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeBell();
  });

  $('#signOut').addEventListener('click', () => signOut());

  // Keep the badge honest while the tab stays open.
  setInterval(pollUnread, 45000);

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.matches('input, select, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { 1: 'ACCOUNTANT', 2: 'TEACHER', 3: 'STUDENT' };
    const role = map[e.key];
    if (role && !e.repeat) {
      e.preventDefault();
      login(role);
    }
  });

  document.addEventListener('cf:signed-out', () => { boot(); });

  boot();
})();
</script>
<script src="/settings.js"></script>
</body>
</html>
